name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-serve.txt pytest==9.1.1 httpx==0.28.1
      - run: pip install --no-deps -e .
      - run: pytest -q
